name: CI

on:
  push:
    branches: [main]
  pull_request:

# 최소 권한 (읽기 전용).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # Gate 0.0.2의 canonical .leerness 계약은 제품 1.36.162부터 제공된다.
      # npm publish 지연과 무관하게 공개 GitHub 릴리스 소스를 검증한다.
      - run: npm run test:installed
        env:
          LEERNESS_PACKAGE_SOURCE: github:gugu9999gu/leerness#v1.36.163
