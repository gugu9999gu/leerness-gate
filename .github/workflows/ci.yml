name: CI

on:
  push:
    branches: [main]
  pull_request:

# 최소 권한 (읽기 전용).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # Standalone checkout에서는 npm latest leerness를 pack하고, monorepo/로컬에서는 sibling source를 pack한다.
      - run: npm run test:installed
